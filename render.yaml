services:
  - type: web
    name: synergylabs-assignment2
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JUDGE_MODEL
        value: openai/gpt-oss-120b
      - key: GENERATOR_MODEL
        value: qwen/qwen3.8-27b
      - key: JUDGE_TEMPERATURE
        value: "0"
