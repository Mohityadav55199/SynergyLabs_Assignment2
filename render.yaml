services:
  - type: web
    name: synergylabs-assignment2
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: JUDGE_MODEL
        value: llama-3.3-70b-versatile
      - key: JUDGE_TEMPERATURE
        value: 0.0
